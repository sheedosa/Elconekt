<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Elconekt — Engineering Smarter, Safer Systems</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- ============================================================
         Security headers via meta-tags.  GitHub Pages can't set true
         HTTP headers, so we lean on the controls that DO work via
         <meta http-equiv>:
           * frame-ancestors 'none'    — kills clickjacking embedding
           * form-action 'self' mailto:— forms can only post to us or open mail
           * base-uri 'self'           — blocks <base> tag injection
           * default-src 'self'        — anything not explicitly listed is denied
           * script-src 'self' + inline— inline allowed for JSON-LD; no external JS
           * upgrade-insecure-requests — auto-upgrade any http:// asset to https://
         Inline-styles allowed: GSAP + Lenis + our own motion code set
         transform/opacity inline.  Inline-scripts allowed: JSON-LD
         structured data block.  Both are static / well-audited.
         ============================================================ -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://elconekt.com; connect-src 'self' https://plausible.io https://formspree.io; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; form-action 'self' mailto: https://formspree.io; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), interest-cohort=()" />

    <!-- Resource hints for everything we know we'll need -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Google Fonts (display=swap so FOIT can never block render) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

    <!-- Analytics: Plausible — cookie-free, GDPR-friendly, no consent banner.
         Loads deferred so it never blocks render. Data flows once the
         'elconekt.com' site is registered in a Plausible account; until
         then this is a harmless no-op. -->
    <link rel="dns-prefetch" href="https://plausible.io" />
    <script defer data-domain="elconekt.com" src="https://plausible.io/js/script.js"></script>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Elconekt — Engineering Smarter, Safer Systems" />
    <meta name="description" content="AI-powered digital solutions, intelligent systems, and enterprise cybersecurity — engineered in the UK for organisations that can't afford to get it wrong." />

  <body>
    <!-- SPA redirect handler for GitHub Pages 404.html -->
    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
